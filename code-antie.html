<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antón Ceballos</title>  <!-- ✏️ CHANGE: your name / site title -->
  <meta name="description" content="My personal page">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* ✏️ CHANGE: your burgundy color — one place controls all text */
      --burgundy: #5C0E23;
      --burgundy-soft: #7A1B33;
    }

    body {
      /* ✏️ CHANGE: your background image URL or local file like "background.jpg" */
      background: url("background.jpg")
                  center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "PingFang SC", "PingFang TC", "PingFang HK",
                   "Hiragino Sans GB", "Microsoft YaHei",
                   "Noto Sans SC", sans-serif;
    }

    .card {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
      width: 100%;
    }

    /* H1 — Bold (weight 700) */
    h1 {
      color: var(--burgundy);
      font-weight: 700;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    /* Tagline — Semibold (weight 600) */
    .tagline {
      color: var(--burgundy-soft);
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    /* Links — plain text, no buttons */
    .links { display: flex; flex-direction: column; gap: 22px; }

    /* Link names — Semibold (weight 600) */
    .links a {
      color: var(--burgundy);
      font-weight: 600;
      font-size: 1.15rem;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: color 0.2s ease;
    }

    /* Hover: darkest shade with an underline */
    .links a:hover {
      color: #3E0716;
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    /* ── Contact form (matches the design) ── */
    .contact-form {
      margin-top: 45px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 12px;
      border: 1px solid var(--burgundy);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--burgundy);
      background: rgba(255, 255, 255, 0.85);
      resize: vertical;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: var(--burgundy-soft);
      opacity: 0.7;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: 2px solid var(--burgundy);
      outline-offset: 2px;
    }

    .contact-form button {
      padding: 12px 30px;
      background: var(--burgundy);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .contact-form button:hover {
      background: #3E0716;
    }

    footer {
      text-align: center;
      color: var(--burgundy-soft);
      font-weight: 400;
      font-size: 0.8rem;
      position: fixed;
      bottom: 15px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- ✏️ CHANGE: your name and tagline -->
    <h1>Antón Ceballos</h1>
    <p class="tagline">artist</p>

    <div class="links">
      <!-- ✏️ CHANGE: edit href="" links. Duplicate any line to add more -->
      <a href="https://instagram.com/antonceballos" target="_blank">Instagram</a>
      <a href="https://www.youtube.com/@AnTONceballos" target="_blank">YouTube</a>

    <!-- ✏️ CHANGE: replace "yourformid" with your Formspree form ID
         (get it free at https://formspree.io — looks like https://formspree.io/f/abc12345) -->
    <form class="contact-form" action="https://formspree.io/f/xeaarvja" method="POST">
      <input type="email" name="email" placeholder="Your email" required>
      <textarea name="message" placeholder="Your message" rows="3" required></textarea>
      <button type="submit">Contact Me</button>
    </form>
  </div>

  <footer>© 2026 Antón Ceballos</footer>

</body>
</html>
