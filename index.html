<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antón Ceballos</title>  <!-- ✏️ CHANGE: your name / site title -->
  <meta name="description" content="My personal page">

  <!-- Barlow web font — DIN-style. DIN Alternate (on Macs) takes priority -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --burgundy: #5C0E23;          /* title, form border, button */
      --burgundy-soft: #7A1B33;     /* links, placeholders */
    }

    body {
      background: url("background.jpg") center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;      /* full-height column layout now */
      align-items: center;
      font-family: "DIN Alternate", "Barlow",
                   "PingFang SC", "PingFang TC", "PingFang HK",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* Title — near the top, bigger */
    h1 {
      color: var(--burgundy);
      font-weight: 600;
      font-size: 2.9rem;           /* ~10% bigger than 2.6rem */
      margin-top: 20vh;            /* pulls it up high on the page */
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* Links — roughly in the middle where they were */
    .links {
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin-top: 12vh;            /* space between title and links */
    }

    .links a {
      color: var(--burgundy-soft);
      font-weight: 400;
      font-size: 1.2rem;
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
    }

    .links a:hover {
      color: #3E0716;
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    /* Form — pushed down near the bottom.
       margin-top: auto shoves everything below the links
       as far down as the page allows */
    .contact-form {
      margin-top: auto;
      margin-bottom: 18vh;         /* distance from the very bottom */
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(400px, 85vw);
    }

    .contact-form input,
    .contact-form textarea {
      padding: 10px 12px;
      border: 1px solid var(--burgundy);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--burgundy);
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      resize: vertical;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: var(--burgundy-soft);
      opacity: 0.7;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: 2px solid var(--burgundy);
      outline-offset: 2px;
    }

    .contact-form button {
      padding: 10px 26px;
      background: var(--burgundy);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .contact-form button:hover {
      background: #3E0716;
    }

    footer {
      text-align: center;
      color: var(--burgundy-soft);
      font-weight: 400;
      font-size: 0.8rem;
      position: fixed;
      bottom: 15px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- ✏️ CHANGE: your name -->
  <h1>Antón Ceballos</h1>

  <div class="links">
    <!-- ✏️ CHANGE: edit href="" links -->
    <a href="https://instagram.com/antonceballos" target="_blank">Instagram</a>
    <a href="https://youtube.com/@AnTONceballos" target="_blank">YouTube</a>

  <!-- ✏️ CHANGE: replace "yourformid" with your Formspree form ID -->
  <form class="contact-form" action="https://formspree.io/f/xeaarvja" method="POST">
    <input type="email" name="email" placeholder="Your email" required>
    <textarea name="message" placeholder="Your message" rows="2" required></textarea>
    <button type="submit">Contact Me</button>
  </form>

  <footer>© 2026 Antón Ceballos</footer>

</body>
</html>
